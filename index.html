<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#080B1A">
<link rel="manifest" href="manifest.json">
<script src="https://accounts.google.com/gsi/client" async defer></script>

<title>Dues</title>

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<script>
(function(){var p=localStorage.getItem('dues.theme')||'system';
var d=p==='dark'||(p==='system'&&matchMedia('(prefers-color-scheme:dark)').matches);
document.documentElement.dataset.theme=d?'dark':'light';})();
</script>
<style>
:root{--bg:#F2F3FB;--card:rgba(255,255,255,.74);--solid:#fff;--ink:#12142B;--mute:#6A6E8F;--line:rgba(18,20,43,.1);
--in:#0DAE80;--out:#E8416A;--warn:#C97F06;--a1:#6D5BFF;--a2:#14BDE0;--g1:rgba(109,91,255,.22);--g2:rgba(20,189,224,.2);
--shadow:0 18px 40px -18px rgba(60,50,160,.35)}
:root[data-theme=dark]{--bg:#080B1A;--card:rgba(255,255,255,.055);--solid:#12162D;--ink:#EEF0FF;--mute:#8D93B8;--line:rgba(255,255,255,.1);
--in:#38E8B4;--out:#FF6F91;--warn:#FFC25A;--g1:rgba(109,91,255,.3);--g2:rgba(20,189,224,.18);--shadow:0 18px 50px -20px rgba(0,0,0,.8)}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--ink);font:600 15px/1.45 Manrope,system-ui,sans-serif;min-height:100vh;
padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);transition:background .45s,color .45s}
body::before{content:"";position:fixed;inset:0;z-index:-1;transition:opacity .45s;
background:radial-gradient(60% 40% at 12% 0%,var(--g1),transparent),radial-gradient(50% 35% at 95% 8%,var(--g2),transparent)}
h1,h2,h3,.big{font-family:Sora,system-ui,sans-serif}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
.app{max-width:520px;margin:0 auto;padding:20px 18px 130px}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
header h1{font-size:26px;letter-spacing:-.02em}header p{color:var(--mute);font-size:13px}
.icon{width:42px;height:42px;border-radius:14px;background:var(--card);border:1px solid var(--line);display:grid;place-items:center;backdrop-filter:blur(14px);transition:transform .2s}
.icon:active{transform:scale(.92)}
.icon svg{width:20px;height:20px;stroke:var(--ink);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.glass{background:var(--card);border:1px solid var(--line);border-radius:28px;backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);box-shadow:var(--shadow)}
.hero{padding:22px 20px 18px}
.ringwrap{position:relative;width:224px;height:224px;margin:2px auto 14px}
.ring{width:100%;height:100%}
.trk{fill:none;stroke:var(--line);stroke-width:14}
.arc{fill:none;stroke-width:14;stroke-linecap:round;transform-origin:100px 100px;stroke-dasharray:0 528;
transition:stroke-dasharray 1.1s cubic-bezier(.2,.8,.2,1),transform 1.1s cubic-bezier(.2,.8,.2,1),opacity .4s}
.arc.in{stroke:var(--in);filter:drop-shadow(0 0 6px var(--in))}.arc.out{stroke:var(--out);filter:drop-shadow(0 0 6px var(--out))}
.mid{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.mid small{color:var(--mute);font-size:13px}.mid .big{font-size:34px;font-weight:700;letter-spacing:-.03em}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{padding:12px 14px;border-radius:18px;background:var(--bg);border:1px solid var(--line)}
.stat small{color:var(--mute);font-size:12.5px;display:block}.stat b{font-family:Sora;font-size:18px}
.stat.i b{color:var(--in)}.stat.o b{color:var(--out)}
.sec{display:flex;justify-content:space-between;align-items:baseline;margin:26px 4px 12px}
.sec h2{font-size:17px}.sec span{color:var(--mute);font-size:13px}
.row{display:grid;grid-template-columns:46px 1fr auto;gap:13px;align-items:center;padding:13px;margin-bottom:10px;width:100%;text-align:left;
border-radius:20px;background:var(--card);border:1px solid var(--line);backdrop-filter:blur(14px);transition:transform .2s,border-color .2s}
.row:active{transform:scale(.985)}.row:hover{border-color:var(--a1)}
.row.go{animation:rise .6s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i)*70ms + 250ms)}
@keyframes rise{from{opacity:0;transform:translateY(16px)}}
.av{width:46px;height:46px;border-radius:16px;display:grid;place-items:center;color:#fff;font:700 16px Sora}
.row .n{font-weight:700}.row .s{color:var(--mute);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .amt{font:700 16px Sora;text-align:right}.pos{color:var(--in)}.neg{color:var(--out)}.zero{color:var(--mute)}
.row.settled{opacity:.55}
.empty{text-align:center;color:var(--mute);padding:34px 20px}.empty b{display:block;color:var(--ink);font:700 17px Sora;margin-bottom:6px}
.fab{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);padding:16px 28px;border-radius:999px;
color:#fff;font-weight:700;background:linear-gradient(135deg,var(--a1),var(--a2));box-shadow:0 14px 34px -8px var(--a1);display:flex;gap:8px;align-items:center;
transition:transform .25s,box-shadow .25s;z-index:5}
.fab:active{transform:translateX(-50%) scale(.94)}.fab svg{width:18px;height:18px;stroke:#fff;stroke-width:2.6;fill:none;stroke-linecap:round}
.scrim{position:fixed;inset:0;background:rgba(5,7,20,.55);backdrop-filter:blur(4px);opacity:0;pointer-events:none;transition:opacity .35s;z-index:20}
.sheet{position:fixed;left:0;right:0;bottom:0;margin:auto;max-width:520px;max-height:90vh;overflow:auto;overscroll-behavior:contain;background:var(--solid);border:1px solid var(--line);
border-radius:30px 30px 0 0;padding:10px 20px calc(24px + env(safe-area-inset-bottom));transform:translateY(105%);transition:transform .5s cubic-bezier(.2,.9,.2,1);z-index:21}
body.open .scrim{opacity:1;pointer-events:auto}body.open .sheet{transform:none}
.grab{display:block;width:42px;height:5px;border-radius:9px;background:var(--line);margin:0 auto}.gz{padding:8px 0 14px;touch-action:none;cursor:grab}
.cl{position:sticky;top:0;float:right;z-index:3;width:36px;height:36px;margin:-34px 0 0 8px;border-radius:50%;background:var(--bg);border:1px solid var(--line);font-size:15px;color:var(--mute)}
.sheet h3{font-size:20px;margin-bottom:14px}
.seg{display:flex;gap:4px;padding:4px;background:var(--bg);border-radius:16px;margin-bottom:16px}
.seg button{flex:1;padding:10px 6px;border-radius:12px;font-size:13.5px;font-weight:700;color:var(--mute);transition:all .25s}
.seg button.on{background:var(--solid);color:var(--ink);box-shadow:0 4px 14px -6px rgba(0,0,0,.35)}
.f{margin-bottom:14px}.f label{display:block;font-size:13px;color:var(--mute);margin-bottom:6px}
input{width:100%;padding:14px;border-radius:14px;background:var(--bg);border:1px solid var(--line);color:var(--ink);font:600 16px Manrope,sans-serif;outline:0;transition:border-color .2s,box-shadow .2s}
input:focus{border-color:var(--a1);box-shadow:0 0 0 4px var(--g1)}
.amt-in{font:700 28px Sora;letter-spacing:-.02em}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:9px 14px;border-radius:999px;background:var(--bg);border:1px solid var(--line);font-size:14px;transition:all .2s}
.chip.on{background:linear-gradient(135deg,var(--a1),var(--a2));color:#fff;border-color:transparent;transform:scale(1.03)}
.tog{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;border-radius:14px;background:var(--bg);margin-bottom:14px;font-size:14px}
.sw{width:44px;height:26px;border-radius:99px;background:var(--line);position:relative;transition:background .25s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .25s}
.sw.on{background:var(--in)}.sw.on::after{transform:translateX(18px)}
.hint{color:var(--mute);font-size:13px;margin:-4px 0 14px}
.btn{width:100%;padding:16px;border-radius:16px;font-weight:700;color:#fff;background:linear-gradient(135deg,var(--a1),var(--a2));box-shadow:0 12px 26px -10px var(--a1);transition:transform .2s}
.btn:active{transform:scale(.97)}.btn.ghost{background:var(--bg);color:var(--ink);box-shadow:none;border:1px solid var(--line)}
.btn.danger{color:var(--out)}.btn.sm{width:auto;padding:11px 18px;font-size:14px}
.ph{display:flex;gap:14px;align-items:center;margin-bottom:16px}.ph .big{font-size:24px;font-weight:700}
.acts{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:18px}.acts .btn{flex:1 1 42%}
.en{padding:14px;border-radius:18px;background:var(--bg);border:1px solid var(--line);margin-bottom:10px}
.en .top{display:flex;justify-content:space-between;gap:10px}.en b{font-weight:700}
.pill{display:inline-block;padding:2px 10px;border-radius:99px;font-size:12px;font-weight:700;background:var(--line);color:var(--mute);margin-right:6px}
.pill.w{background:rgba(255,170,30,.16);color:var(--warn)}.pill.r{background:rgba(255,80,120,.15);color:var(--out)}
.en .m{color:var(--mute);font-size:13px;margin-top:3px}
.en .ac{display:flex;gap:14px;margin-top:10px;font-size:13.5px}.en .ac button{color:var(--a1);font-weight:700}.en .ac .x{color:var(--out);margin-left:auto}
.pay{display:none;gap:8px;margin-top:10px}.pay.show{display:flex}.en.done{opacity:.55}
.toast{position:fixed;top:calc(16px + env(safe-area-inset-top));left:50%;transform:translate(-50%,-250%);opacity:0;visibility:hidden;pointer-events:none;background:var(--ink);color:var(--bg);padding:12px 20px;border-radius:99px;font-size:14px;
transition:transform .45s cubic-bezier(.2,.9,.2,1),opacity .3s,visibility .45s;z-index:60;max-width:90vw;text-align:center}.toast.show{transform:translate(-50%,0);opacity:1;visibility:visible;pointer-events:auto}.toast button{color:var(--a2);font-weight:700;margin-left:12px}
#splash{position:fixed;inset:0;z-index:100;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;transition:opacity .7s,transform .7s}
#splash.gone{opacity:0;transform:scale(1.06);pointer-events:none}
#splash svg{width:120px;height:120px;margin-bottom:14px;filter:drop-shadow(0 0 18px var(--g1))}
#splash circle{fill:none;stroke-width:7;stroke-linecap:round;transform-origin:60px 60px}
.s1{stroke:var(--in);stroke-dasharray:130 146;stroke-dashoffset:276;animation:draw 1.2s .1s cubic-bezier(.3,.8,.2,1) forwards,spin 6s linear infinite}
.s2{stroke:var(--out);stroke-dasharray:110 166;transform:rotate(190deg);stroke-dashoffset:276;animation:draw 1.2s .35s cubic-bezier(.3,.8,.2,1) forwards}
@keyframes draw{to{stroke-dashoffset:0}}@keyframes spin{to{transform:rotate(360deg)}}
#splash h2{font-size:34px;letter-spacing:-.03em;opacity:0;animation:fade .8s .7s forwards}
#splash p{color:var(--mute);opacity:0;animation:fade .8s 1s forwards}@keyframes fade{to{opacity:1}}
.over{display:none;margin-top:14px;padding:13px 16px;border-radius:20px;background:rgba(255,170,30,.13);border:1px solid rgba(255,170,30,.3);color:var(--warn);text-align:left;width:100%;font-size:14px;font-weight:700}.over.show{display:block}
.crow{display:grid;grid-template-columns:1fr 130px;gap:10px;align-items:center;margin-bottom:8px}
.auth{position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;padding:20px;overflow:auto;background:radial-gradient(60% 40% at 12% 0%,var(--g1),transparent),radial-gradient(50% 35% at 95% 8%,var(--g2),transparent),var(--bg)}
.auth.show{display:flex}.acard{width:100%;max-width:400px;padding:28px 22px;animation:rise .6s cubic-bezier(.2,.8,.2,1) both}
.acard h2{font-size:28px;letter-spacing:-.03em}.acard .sub{color:var(--mute);margin-bottom:18px}.err{color:var(--out);font-size:13px;min-height:20px;margin-bottom:6px}
.qr{background:#fff;padding:16px;border-radius:22px;width:fit-content;margin:4px auto 16px}
.or{text-align:center;color:var(--mute);font-size:13px;margin:16px 0 12px}#gbtn{display:flex;justify-content:center;min-height:44px}
.rw{position:relative;margin-bottom:10px;border-radius:20px;overflow:hidden}.rw .row{margin-bottom:0;touch-action:pan-y;user-select:none}.row.dr{background:var(--solid)}
.h{position:absolute;top:0;bottom:0;width:50%;display:flex;align-items:center;padding:0 22px;color:#fff;font-weight:700;opacity:0;transition:opacity .15s}
.hl{left:0;background:var(--a1)}.hr{right:0;justify-content:flex-end;background:var(--in)}.rw[data-d=r] .hl,.rw[data-d=l] .hr{opacity:1}
.spark{margin-top:14px}.spark small{color:var(--mute);font-size:12.5px;display:flex;justify-content:space-between}.spark svg{width:100%;height:56px;display:block;margin-top:6px}
.mn{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.mn button{width:40px;height:40px;border-radius:12px;background:var(--bg);font-size:20px}.mn button:disabled{opacity:.3}.mn b{font:700 17px Sora}
.sg{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.lnk{color:var(--a1);font-weight:700;font-size:13.5px;margin:-4px 0 10px}
.tour{position:fixed;inset:0;z-index:40;display:none;align-items:flex-end;justify-content:center;padding:20px;background:rgba(5,7,20,.6);backdrop-filter:blur(6px)}.tour.show{display:flex}
.tcard{width:100%;max-width:420px;padding:24px;background:var(--solid);animation:rise .5s both}.tcard p{color:var(--mute);margin:6px 0 18px}
.dots{display:flex;gap:6px;margin-bottom:14px}.dots i{width:8px;height:8px;border-radius:9px;background:var(--line);transition:all .3s}.dots i.on{width:22px;background:var(--a1)}
.srch{margin-bottom:12px}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-delay:0s!important;transition-duration:.01ms!important}}
button:focus-visible,input:focus-visible{outline:2px solid var(--a1);outline-offset:2px}
</style>
</head>
<body>
<div id="splash">
  <svg viewBox="0 0 120 120"><circle class="s1" cx="60" cy="60" r="44"/><circle class="s2" cx="60" cy="60" r="44"/></svg>
  <h2>Dues</h2><p>Who owes whom, always clear.</p>
</div>

<div class="auth" id="auth"><div class="glass acard">
  <h2>Dues</h2><p class="sub" id="aSub">Welcome back</p>
  <div class="seg"><button data-act="amode" data-m="login" class="on">Log in</button><button data-act="amode" data-m="signup">Sign up</button></div>

<div class="app">
  <header>
    <div><h1 id="greet">Hello</h1><p id="date"></p></div>
    <div style="display:flex;gap:10px"><button class="icon" data-act="summary" aria-label="Summary"><svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg></button><button class="icon" data-act="settings" aria-label="Settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button></div>
  </header>

<script>
/* Paste your Apps Script Web App /exec URL here. Leave empty to run in local-only mode. */
const API_URL = 'https://script.google.com/macros/s/AKfycbxUuJcBC5bf0eqpshbPPtVtVmt8yjEQhX13hN2wHSOTV5UL1knYfK_DNZS_kWA48M_M/exec';
/* Optional: OAuth Web client ID from Google Cloud Console, to enable "Continue with Google". Must match GOOGLE_CLIENT_ID in Code.js. */
const GOOGLE_CLIENT_ID = '120457271963-cvbfto7ktnph5d160fag45mc7l1akmg3.apps.googleusercontent.com';

const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => 'i' + Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-3);
const fmt = n => '₹' + Number(n).toLocaleString('en-IN', {minimumFractionDigits: Number.isInteger(+n) ? 0 : 2, maximumFractionDigits: 2});
const today = () => new Date(Date.now() - new Date().getTimezoneOffset() * 6e4).toISOString().slice(0, 10);
const days = d => Math.max(0, Math.round((new Date(new Date().toDateString()) - new Date(d + 'T00:00:00')) / 864e5));
const reduce = matchMedia('(prefers-reduced-motion:reduce)').matches;

let S = JSON.parse(localStorage.getItem('dues.data') || 'null') || {people: [], entries: [], payments: []};
S.recurring = S.recurring || []; S.templates = S.templates || [];
const store = () => localStorage.setItem('dues.data', JSON.stringify(S));
const tok = () => localStorage.getItem('dues.token') || '';

/* ---------- data + sync ---------- */
function call(body) {
  return fetch(API_URL, {method: 'POST', body: JSON.stringify({token: tok(), ...body})}).then(r => r.json());
}
/* Every write goes through a saved queue, so nothing is lost when offline and a refresh can never overwrite unsent changes. */
let Q = JSON.parse(localStorage.getItem('dues.q') || '[]'), busy = false, ver = 0;
const saveQ = () => localStorage.setItem('dues.q', JSON.stringify(Q));
function sync(body) { if (!API_URL || !tok()) return; Q.push(body); saveQ(); flush(); }
async function flush() {
  if (busy) return; busy = true;
  try {
    while (Q.length) {
      const j = await call(Q[0]);
      if (j.error === 'auth') { showAuth(); break; }
      if (j.error) toast(j.error);
      Q.shift(); saveQ();
    }
  } catch (e) { toast('Offline. Changes will sync when you reconnect.'); }
  busy = false;

  const x = c.getContext('2d'), P = Array.from({length: 70}, () => ({x: innerWidth / 2, y: innerHeight * .62, vx: (Math.random() - .5) * 12, vy: -Math.random() * 14 - 4, r: Math.random() * 5 + 3, h: Math.random() * 360, a: 1}));
  (function f() { x.clearRect(0, 0, c.width, c.height); P.forEach(p => { p.x += p.vx; p.y += p.vy; p.vy += .45; p.a -= .012; x.globalAlpha = Math.max(p.a, 0); x.fillStyle = `hsl(${p.h} 90% 60%)`; x.fillRect(p.x, p.y, p.r, p.r * 1.6); }); P[0].a > 0 ? requestAnimationFrame(f) : c.remove(); })();
}
function editSheet(id) {
  const e = S.entries.find(x => x.id === id);
  sheet(`<h3>Edit entry</h3><div class="f"><label>Amount</label><input id="ea" class="amt-in" inputmode="decimal" value="${e.amount}"></div>
  <div class="f"><label>What is it for?</label><input id="er" value="${esc(e.reason)}"></div><div class="f"><label>Date</label><input id="ed" type="date" value="${e.date}"></div>
  <button class="btn" data-act="editsave" data-id="${id}">Save changes</button>`);
}
function editP(id) {
  const p = S.people.find(x => x.id === id);
  sheet(`<h3>Edit details</h3><div class="f"><label>Name</label><input id="pn" value="${esc(p.name)}"></div><div class="f"><label>WhatsApp number</label><input id="pp" inputmode="tel" value="${esc(p.phone || '')}"></div>
  <button class="btn" data-act="psave" data-id="${id}">Save</button><button class="btn ghost" style="margin-top:10px" data-act="unshare" data-id="${id}">Stop sharing view link</button>`);
}
async function shareLink(pid) {
  if (!API_URL) return toast('Connect your Google Sheet first');
  const p = S.people.find(x => x.id === pid);
  try {
    await flush(); const j = await call({action: 'share', personId: pid}); if (j.error) return toast(j.error);
    const url = location.origin + location.pathname.replace(/[^/]*$/, '') + 'view.html?a=' + encodeURIComponent(API_URL) + '&t=' + j.token;
    if (navigator.share) navigator.share({title: 'Dues', text: `Hi ${p.name}, here is what is open between us:`, url}).catch(() => {});
    else { navigator.clipboard && navigator.clipboard.writeText(url); toast('Link copied'); }
  } catch (e) { toast('Could not create the link. Check your connection.'); }
}
function statement(pid) {
  const p = S.people.find(x => x.id === pid), b = bal(pid);
  const tr = S.entries.filter(e => e.personId === pid).sort((x, y) => x.date.localeCompare(y.date)).map(e => `<tr><td>${e.date}</td><td>${esc(e.reason)}</td><td>${e.dir === 'lent' ? 'They owe me' : 'I owe them'}</td><td>${fmt(e.amount)}</td><td>${fmt(paidOf(e))}</td><td>${fmt(leftOf(e))}</td></tr>`).join('');
  const w = window.open('', '_blank'); if (!w) return toast('Allow pop-ups to export');
  w.document.write(`<!doctype html><title>Statement - ${esc(p.name)}</title><meta name="viewport" content="width=device-width"><style>body{font:14px system-ui;padding:24px}table{border-collapse:collapse;width:100%}td,th{border-bottom:1px solid #ddd;padding:8px;text-align:left}h2{margin-bottom:4px}</style>
  <h2>Statement: ${esc(p.name)}</h2><p>${new Date().toLocaleDateString('en-IN')} · ${b > 0 ? esc(p.name) + ' owes ' + fmt(b) : b < 0 ? 'Owed to ' + esc(p.name) + ': ' + fmt(-b) : 'All settled'}</p>
  <table><tr><th>Date</th><th>For</th><th>Type</th><th>Amount</th><th>Paid</th><th>Left</th></tr>${tr}</table><script>setTimeout(function(){print()},300)<\/script>`);
  w.document.close();
}
function exportCSV() {
  const q = v => '"' + String(v).replace(/"/g, '""') + '"';
  const rows = [['Person', 'Direction', 'Amount', 'Paid', 'Left', 'Reason', 'Date']].concat(S.entries.map(e => [(S.people.find(x => x.id === e.personId) || {}).name || '', e.dir === 'lent' ? 'They owe me' : 'I owe them', e.amount, paidOf(e), leftOf(e), e.reason, e.date]));
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob(['\ufeff' + rows.map(r => r.map(q).join(',')).join('\n')], {type: 'text/csv'})); a.download = 'dues-export.csv'; a.click();
}
const TOUR = [['Track every rupee', 'Tap Add to split a bill or record a loan. Each person gets their own running balance.'], ['Swipe to act', 'Swipe a person right to send a reminder, or left to settle up. Tap them for details, edits and sharing.'], ['Get paid faster', 'Add your UPI ID in Settings. Reminders then carry a payment link, and you can show a QR or share a live balance link.']];
let ti = 0;
function maybeTour() { if (localStorage.getItem('dues.tour') || $('#auth').classList.contains('show')) return; ti = 0; tour(); }
function tourEnd() { localStorage.setItem('dues.tour', '1'); $('#tour').classList.remove('show'); }
function tour() {
  const t = $('#tour'), [h, p] = TOUR[ti]; t.classList.add('show');
  t.innerHTML = `<div class="glass tcard"><div class="dots">${TOUR.map((_, i) => `<i class="${i === ti ? 'on' : ''}"></i>`).join('')}</div><h3>${h}</h3><p>${p}</p>
  <button class="btn" data-act="tnext">${ti < TOUR.length - 1 ? 'Next' : 'Get started'}</button><button class="lnk" data-act="tskip" style="display:block;margin:12px auto 0">Skip</button></div>`;
}
const addP = (d, e) => { const x = new Date(d + 'T00:00:00');
  if (e === 'weekly') x.setDate(x.getDate() + 7); else { const day = x.getDate(); x.setDate(1); x.setMonth(x.getMonth() + 1); x.setDate(Math.min(day, new Date(x.getFullYear(), x.getMonth() + 1, 0).getDate())); }
  return new Date(x.getTime() - x.getTimezoneOffset() * 6e4).toISOString().slice(0, 10); };
function runRecurring() {
  const t = today(); let n = 0;
  (S.recurring || []).slice().forEach(r => {
    if (!S.people.some(p => p.id === r.personId)) return del('recurring', r.id);
    let nx = r.next, k = 0;
    while (nx <= t && k++ < 24) { put('entries', {id: uid(), personId: r.personId, dir: r.dir, amount: r.amount, reason: r.reason, date: nx, owner: 'me'}); nx = addP(nx, r.every); n++; }
    if (nx !== r.next) put('recurring', {...r, next: nx});
  });
  if (n) { render(); toast(`${n} recurring ${n > 1 ? 'entries' : 'entry'} added`); }
}
function swipeAct(pid, k) {
  const p = S.people.find(x => x.id === pid), b = bal(pid);
  if (k === 'remind') return b > 0 ? remind(pid) : toast(`${p.name} doesn't owe you anything`);
  const o = openOf(pid); if (!o.length) return toast('Already settled');
  const added = o.map(e => ({id: uid(), entryId: e.id, amount: leftOf(e), date: today(), owner: 'me'})); added.forEach(x => put('payments', x)); render();
  toast('Settled', () => { added.forEach(x => del('payments', x.id)); render(); }); fx();
}
function summary(off) {
  const d = new Date(); d.setDate(1); d.setMonth(d.getMonth() + off);
  const k = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0'), sum = a => a.reduce((t, x) => t + Number(x.amount), 0);
  const me = S.entries.filter(e => e.date.startsWith(k)), lent = me.filter(e => e.dir === 'lent'), bor = me.filter(e => e.dir !== 'lent');
  const pm = S.payments.filter(p => p.date.startsWith(k)), kind = p => (S.entries.find(e => e.id === p.entryId) || {}).dir;
  const got = pm.filter(p => kind(p) === 'lent'), paid = pm.filter(p => kind(p) === 'borrowed');
  const slow = S.people.map(p => ({p, o: openOf(p.id).filter(e => e.dir === 'lent')[0]})).filter(x => x.o).sort((a, b) => a.o.date.localeCompare(b.o.date))[0];
  const top = S.people.map(p => ({p, v: sum(lent.filter(e => e.personId === p.id))})).filter(x => x.v).sort((a, b) => b.v - a.v).slice(0, 3);
  sheet(`<h3>Summary</h3><div class="mn"><button data-act="sm" data-o="${off - 1}">‹</button><b>${d.toLocaleDateString('en-IN', {month: 'long', year: 'numeric'})}</b><button data-act="sm" data-o="${off + 1}" ${off >= 0 ? 'disabled' : ''}>›</button></div>
  <div class="sg"><div class="stat i"><small>Lent out</small><b>${fmt(sum(lent))}</b></div><div class="stat i"><small>Received back</small><b>${fmt(sum(got))}</b></div>
  <div class="stat o"><small>Borrowed</small><b>${fmt(sum(bor))}</b></div><div class="stat o"><small>You repaid</small><b>${fmt(sum(paid))}</b></div></div>
  ${slow ? `<div class="en"><small style="color:var(--mute)">Slowest to pay</small><div class="top"><b>${esc(slow.p.name)}</b><b class="neg">Day ${days(slow.o.date)}</b></div><div class="m">${esc(slow.o.reason)} · ${fmt(leftOf(slow.o))} still open</div></div>` : ''}
  ${top.length ? `<div class="sec" style="margin:14px 4px 10px"><h2>Most lent this month</h2></div>${top.map(x => `<div class="en"><div class="top"><b>${esc(x.p.name)}</b><b>${fmt(x.v)}</b></div></div>`).join('')}` : '<div class="empty">Nothing lent this month.</div>'}`);
}
function settings() {
  const t = localStorage.getItem('dues.theme') || 'system';
  sheet(`<h3>Settings</h3><div class="f"><label>Theme</label><div class="seg" id="th">${['system', 'light', 'dark'].map(x => `<button class="${t === x ? 'on' : ''}" data-act="theme" data-t="${x}">${x[0].toUpperCase() + x.slice(1)}</button>`).join('')}</div></div>
  ${API_URL ? `<div class="f"><label>Signed in as</label><div class="tog" style="margin:0"><span>${esc(localStorage.getItem('dues.email') || '')}</span><button data-act="logout" style="color:var(--out);font-weight:700">Log out</button></div></div>` : ''}
  <div class="f"><label>Your name (shown on payment requests)</label><input id="nm" value="${esc(localStorage.getItem('dues.name') || '')}"></div><div class="f"><label>Your UPI ID</label><input id="upi" value="${esc(localStorage.getItem('dues.upi') || '')}" placeholder="name@bank"></div>
  <p class="hint">${API_URL ? 'Connected to Google Sheets.' : 'Local mode. Data stays on this device until you set API_URL in index.html.'}</p>
  <button class="btn ghost" style="margin-bottom:10px" data-act="csv">Export all data (CSV)</button><button class="btn ghost" style="margin-bottom:10px" data-act="tourr">Replay quick tour</button>
  <button class="btn" data-act="savekey">Save</button>`);
}
function applyTheme() {
  const p = localStorage.getItem('dues.theme') || 'system', d = p === 'dark' || (p === 'system' && matchMedia('(prefers-color-scheme:dark)').matches);
  document.documentElement.dataset.theme = d ? 'dark' : 'light';
  document.querySelector('meta[name=theme-color]').content = d ? '#080B1A' : '#F2F3FB';
}
matchMedia('(prefers-color-scheme:dark)').addEventListener('change', applyTheme);

/* ---------- events ---------- */
document.addEventListener('click', e => {
  const t = e.target.closest('[data-act]'); if (!t) return;
  const id = t.dataset.id, act = t.dataset.act;
  if (act === 'add') addSheet();
  else if (act === 'addfor') addSheet(id);
  else if (act === 'settle') settleUp(id);
  else if (act === 'cust') { A.custom = !A.custom; upd(); }
  else if (act === 'over') { if (id) personSheet(id); }
  else if (act === 'settings') settings();
  else if (act === 'close') closeSheet();
  else if (act === 'person') { if (!swiped) personSheet(id); }
  else if (act === 'mode') { A.mode = t.dataset.m; if (A.mode !== 'split' && A.sel.size + (A.newp ? 1 : 0) > 1) { A.sel.clear(); A.newp = false; } upd(); }
  else if (act === 'chip') { if (A.mode === 'split') A.sel.has(id) ? A.sel.delete(id) : A.sel.add(id); else { A.sel = new Set([id]); A.newp = false; } upd(); }
  else if (act === 'newp') { A.newp = !A.newp; if (A.mode !== 'split' && A.newp) A.sel.clear(); upd(); }
  else if (act === 'me') { A.me = !A.me; upd(); }
  else if (act === 'save') saveAdd();
  else if (act === 'pay') $('#pay-' + id).classList.toggle('show');
  else if (act === 'paysave') {
    const en = S.entries.find(x => x.id === id), v = parseFloat($('#pay-' + id + ' input').value);
    if (!(v > 0) || v > leftOf(en) + .001) return toast('Enter an amount up to ' + fmt(leftOf(en)));
    put('payments', {id: uid(), entryId: id, amount: v, date: today(), owner: 'me'}); personSheet(en.personId); render(); toast('Payment recorded'); if (!bal(en.personId)) fx();
  }
  else if (act === 'delen') { const en = S.entries.find(x => x.id === id), ps = S.payments.filter(p => p.entryId === id);
    ps.forEach(p => del('payments', p.id)); del('entries', id); personSheet(en.personId); render();
    toast('Entry deleted', () => { put('entries', en); ps.forEach(p => put('payments', p)); personSheet(en.personId); render(); }); }
  else if (act === 'delp') { if (!confirm('Remove this person and all their entries?')) return;
    S.entries.filter(x => x.personId === id).forEach(en => { S.payments.filter(p => p.entryId === en.id).forEach(p => del('payments', p.id)); del('entries', en.id); });
    del('people', id); closeSheet(); render(); }
  else if (act === 'remind') remind(id);
  else if (act === 'theme') { localStorage.setItem('dues.theme', t.dataset.t); applyTheme(); settings(); }
  else if (act === 'savekey') { const nm = $('#nm').value.trim(), up = $('#upi').value.trim(); localStorage.setItem('dues.name', nm); localStorage.setItem('dues.upi', up);
    sync({action: 'profile', name: nm, upi: up}); greet(); closeSheet(); toast('Saved'); }
  else if (act === 'qr') qrSheet(id);
  else if (act === 'forgot') authMode('forgot');
  else if (act === 'edit') editSheet(id);
  else if (act === 'editsave') { const en = S.entries.find(x => x.id === id), a = parseFloat($('#ea').value);
    if (!(a > 0)) return toast('Enter an amount'); if (a < paidOf(en) - .001) return toast('Already paid ' + fmt(paidOf(en)) + '. Amount cannot be lower.');
    put('entries', {...en, amount: a, reason: $('#er').value.trim() || en.reason, date: $('#ed').value || en.date}); personSheet(en.personId); render(); toast('Updated'); }
  else if (act === 'editp') editP(id);
  else if (act === 'psave') { const p = S.people.find(x => x.id === id); put('people', {...p, name: $('#pn').value.trim() || p.name, phone: $('#pp').value.trim()}); personSheet(id); render(); }
  else if (act === 'unshare') { sync({action: 'unshare', personId: id}); toast('View link disabled'); }
  else if (act === 'share') shareLink(id);
  else if (act === 'stmt') statement(id);
  else if (act === 'csv') exportCSV();
  else if (act === 'tsave') { A.tsave = !A.tsave; upd(); }
  else if (act === 'tpl') { const tp = S.templates.find(x => x.id === id); A.mode = 'split'; A.sel = new Set(tp.people.split(',').filter(i => S.people.some(p => p.id === i))); $('#reason').value = tp.reason; upd(); }
  else if (act === 'tpldel') { del('templates', id); upd(); }
  else if (act === 'tnext') { if (ti < TOUR.length - 1) { ti++; tour(); } else tourEnd(); }
  else if (act === 'tskip') tourEnd();
  else if (act === 'tourr') { closeSheet(); localStorage.removeItem('dues.tour'); ti = 0; tour(); }
  else if (act === 'summary') summary(0);
  else if (act === 'sm') summary(+t.dataset.o);
  else if (act === 'rep') { A.rep = {'': 'monthly', monthly: 'weekly', weekly: ''}[A.rep]; upd(); }
  else if (act === 'stoprec') { const r = S.recurring.find(x => x.id === id); del('recurring', id); personSheet(r.personId); toast('Stopped repeating'); }
  else if (act === 'logout') logout();
  else if (act === 'amode') authMode(t.dataset.m);
  else if (act === 'auth') doAuth();
});
document.addEventListener('input', e => { if (e.target.classList.contains('cs')) A.cs[e.target.dataset.pid] = e.target.value; });
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeSheet(); if (e.key === 'Enter' && $('#auth').classList.contains('show')) doAuth(); });

/* drag the handle down to close a sheet */
let gz = null;
$('#sheet').addEventListener('pointerdown', e => { if (e.target.closest('.gz')) gz = {y: e.clientY, dy: 0}; });
addEventListener('pointermove', e => { if (!gz) return; gz.dy = Math.max(0, e.clientY - gz.y); const s = $('#sheet'); s.style.transition = 'none'; s.style.transform = `translateY(${gz.dy}px)`; });
const gzEnd = () => { if (!gz) return; const s = $('#sheet'), d = gz.dy; gz = null; s.style.transition = ''; s.style.transform = ''; if (d > 90) closeSheet(); };
addEventListener('pointerup', gzEnd); addEventListener('pointercancel', gzEnd);

/* swipe on person rows: right = remind, left = settle */
let sw = null, swiped = false;
$('#list').addEventListener('pointerdown', e => { const r = e.target.closest('.row'); if (r) sw = {r, x: e.clientX, dx: 0, on: false}; });
addEventListener('pointermove', e => { if (!sw) return; const dx = e.clientX - sw.x; if (!sw.on && Math.abs(dx) > 12) { sw.on = true; sw.r.classList.add('dr'); } if (!sw.on) return;
  sw.dx = Math.max(-110, Math.min(110, dx)); sw.r.style.transition = 'none'; sw.r.style.transform = `translateX(${sw.dx}px)`; sw.r.parentNode.dataset.d = sw.dx > 0 ? 'r' : 'l'; });
const swEnd = () => { if (!sw) return; const {r, dx, on} = sw; sw = null; r.style.transition = ''; r.style.transform = ''; r.classList.remove('dr'); delete r.parentNode.dataset.d;
  if (!on) return; swiped = true; setTimeout(() => swiped = false, 60); if (dx > 70) swipeAct(r.dataset.id, 'remind'); else if (dx < -70) swipeAct(r.dataset.id, 'settle'); };
addEventListener('pointerup', swEnd); addEventListener('pointercancel', swEnd);

/* ---------- boot ---------- */
const h = new Date().getHours();
const greet = () => { const n = (localStorage.getItem('dues.name') || '').split(' ')[0]; $('#greet').textContent = (h < 12 ? 'Good morning' : h < 18 ? 'Good afternoon' : 'Good evening') + (n ? ', ' + n : ''); };
greet();
$('#date').textContent = new Date().toLocaleDateString('en-IN', {weekday: 'long', day: 'numeric', month: 'long'});
setTimeout(() => { fixDates(); render(); if (API_URL && !tok()) showAuth(); if (!API_URL) runRecurring(); }, 1700);
setTimeout(() => { $('#splash').classList.add('gone'); setTimeout(() => $('#splash').remove(), 800); }, 2000);
$('#q').addEventListener('input', render);
setTimeout(maybeTour, 2600);
load();
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js');
</script>
